<ion-content class="auth-page">
<main class="auth">
  <section class="auth__panel">
    <h1 class="auth__title">Sign in</h1>
    <p class="auth__subtitle">Welcome back, seeker.</p>

    @if (error()) {
      <p class="auth__error" role="alert">{{ error() }}</p>
    }

    <form class="auth__form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="auth__field">
        <span class="auth__label">Email</span>
        <input
          class="auth__input"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="you@example.com"
        />
      </label>

      <label class="auth__field">
        <span class="auth__label">Password</span>
        <input
          class="auth__input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
      </label>

      <button class="auth__submit" type="submit" [disabled]="form.invalid || pending()">
        {{ pending() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="auth__switch">
      No account yet? <a routerLink="/auth/register">Create one</a>
    </p>
  </section>
</main>
</ion-content>
