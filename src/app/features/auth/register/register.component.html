<ion-content class="auth-page">
<main class="auth">
  <section class="auth__panel">
    <h1 class="auth__title">Create your account</h1>
    <p class="auth__subtitle">A reading is waiting for you.</p>

    @if (error()) {
      <p class="auth__error" role="alert">{{ error() }}</p>
    }

    <form class="auth__form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="auth__field">
        <span class="auth__label">Display name (optional)</span>
        <input
          class="auth__input"
          type="text"
          formControlName="displayName"
          autocomplete="name"
          placeholder="Ayla"
        />
      </label>

      <label class="auth__field">
        <span class="auth__label">Email</span>
        <input
          class="auth__input"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="you@example.com"
        />
      </label>

      <label class="auth__field">
        <span class="auth__label">Password</span>
        <input
          class="auth__input"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          placeholder="At least 8 characters"
        />
      </label>

      <label class="auth__field">
        <span class="auth__label">Confirm password</span>
        <input
          class="auth__input"
          type="password"
          formControlName="confirm"
          autocomplete="new-password"
          placeholder="Repeat it"
        />
      </label>

      <button class="auth__submit" type="submit" [disabled]="form.invalid || pending()">
        {{ pending() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="auth__switch">
      Already have an account? <a routerLink="/auth/login">Sign in</a>
    </p>
  </section>
</main>
</ion-content>
