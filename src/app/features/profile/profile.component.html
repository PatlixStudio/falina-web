<ion-content class="profile">
  <div class="profile__inner">
    <header class="profile__header">
      <span class="profile__avatar" aria-hidden="true">{{ (user()?.displayName || user()?.email || '?').charAt(0).toUpperCase() }}</span>
      <h1 class="profile__title">{{ user()?.displayName || 'Your profile' }}</h1>
      <p class="profile__subtitle">{{ user()?.email }}</p>
    </header>

    <section class="profile__card">
      <dl class="profile__row">
        <dt>Member since</dt>
        <dd>{{ (user()?.createdAt || '').slice(0, 10) || '—' }}</dd>
      </dl>
      <dl class="profile__row">
        <dt>Plan</dt>
        <dd>Free</dd>
      </dl>
      <dl class="profile__row">
        <dt>Role</dt>
        <dd>{{ user()?.role }}</dd>
      </dl>
    </section>

    <button type="button" class="profile__logout" (click)="logout()">Log out</button>
  </div>
</ion-content>
