<main class="splash">
  <section class="brand">
    <span class="brand__orb" aria-hidden="true"></span>
    <h1 class="brand__wordmark">{{ appName }}</h1>
    <p class="brand__tagline">{{ tagline }}</p>
    <p class="brand__quote">Read the signs. Ask the cards. Discover your sky.</p>
  </section>

  <section class="pillars" aria-label="Readings">
    @for (pillar of pillars; track pillar.name) {
      <div class="pillar">
        <span class="pillar__name">{{ pillar.name }}</span>
        <span class="pillar__line">{{ pillar.line }}</span>
      </div>
    }
  </section>
</main>
