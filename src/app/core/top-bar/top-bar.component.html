<header class="topbar">
  <a class="topbar__brand" routerLink="/">
    <span class="topbar__orb" aria-hidden="true"></span>
    <span class="topbar__wordmark">{{ appName }}</span>
  </a>

  <nav class="topbar__actions" aria-label="Account">
    <button
      type="button"
      class="topbar__theme"
      (click)="toggleTheme()"
      [attr.aria-label]="isWarm() ? 'Switch to Cosmic theme' : 'Switch to Ember theme'"
      [attr.title]="isWarm() ? 'Switch to Cosmic theme' : 'Switch to Ember theme'"
    >
      @if (isWarm()) {
        <ion-icon name="sparkles-outline" aria-hidden="true"></ion-icon>
      } @else {
        <ion-icon name="flame-outline" aria-hidden="true"></ion-icon>
      }
    </button>

    @if (isAuthenticated()) {
      <span class="topbar__email">{{ user()?.email }}</span>
      <button type="button" class="topbar__link" (click)="logout()">Log out</button>
    } @else {
      <a class="topbar__link" routerLink="/auth/login">Sign in</a>
    }
  </nav>
</header>
